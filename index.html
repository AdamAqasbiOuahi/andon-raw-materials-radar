<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDON · Radar Matières Premières</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.mini.min.js"></script>
<style>
:root{
  --bg:#10131a;
  --bg-grid: #171b23;
  --panel:#181c25;
  --panel-alt:#1f242e;
  --panel-raised:#242a35;
  --border:#2b313d;
  --border-soft:#232833;
  --text:#e9ebef;
  --text-dim:#9aa4b2;
  --text-faint:#5c6572;
  --red:#f0503f;
  --red-tint:rgba(240,80,63,0.14);
  --amber:#f2a93b;
  --amber-tint:rgba(242,169,59,0.14);
  --violet:#a78bfa;
  --violet-tint:rgba(167,139,250,0.14);
  --blue:#4c9fe8;
  --blue-tint:rgba(76,159,232,0.14);
  --green:#3ad48a;
  --green-tint:rgba(58,212,138,0.14);
  --gray:#6b7480;
  --gray-tint:rgba(107,116,128,0.12);
  --font-head:'IBM Plex Sans Condensed',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--bg-grid) 1px, transparent 1px) 0 0/100% 42px,
    var(--bg);
  color:var(--text);
  font-family:var(--font-mono);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
h1,h2,h3,h4{font-family:var(--font-head); font-weight:600; margin:0; letter-spacing:0.01em;}
button{font-family:var(--font-mono); cursor:pointer; color:inherit;}
input,select{font-family:var(--font-mono);}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:var(--panel);}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

#app{min-height:100vh; display:flex; flex-direction:column;}

/* ---------- shared bits ---------- */
.eyebrow{
  font-family:var(--font-head); text-transform:uppercase; letter-spacing:0.16em;
  font-size:11px; color:var(--text-faint); font-weight:600;
}
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:3px;
  font-size:11px; font-weight:600; font-family:var(--font-head); letter-spacing:0.03em; white-space:nowrap;
}
.dot{width:7px; height:7px; border-radius:50%; flex:none;}
.btn{
  background:var(--panel-raised); color:var(--text); border:1px solid var(--border);
  padding:10px 18px; border-radius:4px; font-size:13px; font-weight:600; font-family:var(--font-head);
  letter-spacing:0.04em; text-transform:uppercase; transition:all .15s;
}
.btn:hover{border-color:var(--text-dim); background:#2a303c;}
.btn.primary{background:var(--amber); color:#1a1305; border-color:var(--amber);}
.btn.primary:hover{background:#f7bb5c;}
.btn.primary:disabled{background:var(--panel-raised); color:var(--text-faint); border-color:var(--border); cursor:not-allowed;}
.btn.ghost{background:transparent;}

/* ================= SCREEN: UPLOAD ================= */
.screen-center{flex:1; display:flex; align-items:center; justify-content:center; padding:32px;}
.upload-card{width:100%; max-width:720px;}
.brand-row{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
.brand-mark{
  width:38px; height:38px; border-radius:6px; background:var(--amber);
  display:flex; align-items:center; justify-content:center; flex:none;
  box-shadow:0 0 22px rgba(242,169,59,0.35);
}
.brand-mark svg{width:20px; height:20px;}
.brand-name{font-family:var(--font-head); font-size:26px; font-weight:700; letter-spacing:0.05em;}
.brand-sub{color:var(--text-dim); font-size:13.5px; margin-top:2px;}
.upload-intro{color:var(--text-dim); font-size:13.5px; line-height:1.6; margin:22px 0 26px; max-width:560px;}

.dropzone{
  border:2px dashed var(--border); border-radius:8px; padding:40px 24px; text-align:center;
  background:var(--panel); transition:all .15s; position:relative;
}
.dropzone.drag{border-color:var(--amber); background:var(--panel-alt);}
.dropzone .dz-icon{width:34px; height:34px; margin:0 auto 14px; color:var(--text-faint);}
.dropzone .dz-title{font-family:var(--font-head); font-size:15px; font-weight:600;}
.dropzone .dz-sub{color:var(--text-faint); font-size:12px; margin-top:6px;}
.dropzone input{position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;}

.filechecks{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:20px;}
.filecheck{
  border:1px solid var(--border); border-radius:6px; padding:12px 12px; background:var(--panel);
  display:flex; flex-direction:column; gap:6px; min-height:74px;
}
.filecheck.ok{border-color:rgba(58,212,138,0.4); background:var(--green-tint);}
.filecheck.err{border-color:rgba(240,80,63,0.45); background:var(--red-tint);}
.filecheck .fc-top{display:flex; align-items:center; gap:7px; font-family:var(--font-head); font-weight:600; font-size:12.5px;}
.filecheck .fc-name{color:var(--text-faint); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.status-icon{width:15px; height:15px; flex:none;}

.upload-error{
  margin-top:14px; padding:10px 12px; border:1px solid rgba(240,80,63,0.4); background:var(--red-tint);
  border-radius:6px; font-size:12.5px; color:#ffb3ab;
}
.upload-actions{display:flex; justify-content:flex-end; margin-top:24px; gap:10px;}
.demo-box{
  display:flex; align-items:center; flex-wrap:wrap; gap:14px 18px; margin-top:26px; padding-top:20px; border-top:1px solid var(--border);
}
.demo-box .demo-text{flex:1 1 260px; min-width:0;}
.demo-box .demo-title{font-family:var(--font-head); font-weight:600; font-size:13.5px;}
.demo-box .demo-note{color:var(--text-faint); font-size:11.5px; line-height:1.55; margin-top:4px;}
.demo-box .btn{flex:none; white-space:nowrap;}
.demo-line{color:var(--text-faint); font-size:11.5px; line-height:1.55; margin-top:10px;}
.tb-badge{
  margin-left:12px; padding:3px 9px; border-radius:999px; font-size:10.5px; font-weight:600; letter-spacing:0.03em;
  white-space:nowrap; cursor:help;
}
.tb-badge.demo{color:var(--amber); background:var(--amber-tint); border:1px solid rgba(242,169,59,0.4);}
.tb-badge.stale{color:var(--text-dim); border:1px solid var(--border);}

/* ================= SCREEN: USER SELECT ================= */
.userselect-wrap{width:100%; max-width:640px; text-align:center;}
.avatar-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px; margin-top:30px;}
.avatar-tile{
  border:1px solid var(--border); background:var(--panel); border-radius:10px; padding:22px 14px;
  display:flex; flex-direction:column; align-items:center; gap:10px; transition:all .15s;
}
.avatar-tile:hover{border-color:var(--amber); background:var(--panel-alt); transform:translateY(-2px);}
.avatar-circle{
  width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-head); font-weight:700; font-size:20px; color:#fff;
}
.avatar-tile .a-name{font-family:var(--font-head); font-weight:600; font-size:14px; color:var(--text);}
.avatar-tile .a-count{color:var(--text-faint); font-size:11px;}
.team-link{margin-top:26px; color:var(--text-dim); font-size:12.5px; text-decoration:underline; text-underline-offset:3px; cursor:pointer; background:none; border:none; font-family:var(--font-mono);}
.team-link:hover{color:var(--text);}

/* ================= DASHBOARD ================= */
.topbar{
  display:flex; align-items:center; justify-content:space-between; padding:14px 22px;
  border-bottom:1px solid var(--border); background:rgba(20,23,29,0.9); backdrop-filter:blur(6px);
  position:sticky; top:0; z-index:30;
}
.topbar-left{display:flex; align-items:center; gap:12px;}
.topbar-left .brand-mark{width:28px; height:28px; box-shadow:none;}
.topbar-left .brand-mark svg{width:15px; height:15px;}
.tb-title{font-family:var(--font-head); font-weight:700; font-size:15px; letter-spacing:0.04em;}
.tb-week{color:var(--text-faint); font-size:11.5px; margin-left:14px; padding-left:14px; border-left:1px solid var(--border);}
.topbar-right{display:flex; align-items:center; gap:10px;}
.icon-btn{
  background:var(--panel-raised); border:1px solid var(--border); border-radius:5px; width:34px; height:34px;
  display:flex; align-items:center; justify-content:center; color:var(--text-dim);
}
.icon-btn:hover{color:var(--text); border-color:var(--text-dim);}
.icon-btn svg{width:16px; height:16px;}
.user-chip{
  display:flex; align-items:center; gap:8px; background:var(--panel-raised); border:1px solid var(--border);
  border-radius:20px; padding:5px 12px 5px 5px; position:relative;
}
.user-chip .avatar-circle{width:24px; height:24px; font-size:11px;}
.user-chip .u-name{font-family:var(--font-head); font-weight:600; font-size:12.5px;}
.user-menu{
  position:absolute; top:calc(100% + 8px); right:0; background:var(--panel-raised); border:1px solid var(--border);
  border-radius:8px; padding:6px; min-width:190px; box-shadow:0 10px 30px rgba(0,0,0,0.4); z-index:50;
}
.user-menu button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none;
  color:var(--text); padding:8px 9px; border-radius:5px; font-size:12.5px;
}
.user-menu button:hover{background:var(--panel-alt);}
.user-menu .um-avatar{width:20px; height:20px; border-radius:50%; font-size:9px; display:flex; align-items:center; justify-content:center; font-family:var(--font-head); font-weight:700; color:#fff; flex:none;}
.user-menu hr{border:none; border-top:1px solid var(--border); margin:5px 2px;}

.main{max-width:1360px; margin:0 auto; padding:26px 22px 70px; width:100%;}

/* Andon tiles */
.andon-row{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:8px;}
.andon-tile{
  border:1px solid var(--border); border-radius:10px; padding:18px 18px 16px; background:var(--panel);
  cursor:pointer; text-align:left; position:relative; overflow:visible; transition:all .15s;
}
.andon-tile:hover{transform:translateY(-2px); border-color:var(--panel-raised);}
.andon-tile.active{border-color:currentColor; background:var(--panel-alt);}
.andon-tile .at-top{display:flex; align-items:center; justify-content:space-between;}
.andon-tile .at-light{width:11px; height:11px; border-radius:50%; box-shadow:0 0 12px currentColor;}
.andon-tile.pulse .at-light{animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
.andon-tile .at-count{font-family:var(--font-head); font-size:34px; font-weight:700; margin-top:10px; line-height:1;}
.andon-tile .at-label{font-family:var(--font-head); font-weight:600; font-size:13px; margin-top:6px; letter-spacing:0.01em;}
.andon-tile .at-sub{color:var(--text-faint); font-size:11px; margin-top:4px; line-height:1.5;}
.info-btn{
  width:17px; height:17px; border-radius:50%; border:1px solid var(--text-faint); color:var(--text-faint);
  font-family:var(--font-head); font-weight:700; font-size:10px; display:flex; align-items:center; justify-content:center;
  flex:none; background:transparent; cursor:pointer; font-style:normal;
}
.info-btn:hover{border-color:var(--text); color:var(--text);}
.info-pop{
  position:absolute; top:calc(100% + 8px); left:0; right:0; z-index:40; background:var(--panel-raised);
  border:1px solid var(--border); border-radius:8px; padding:12px 14px; text-align:left; cursor:default;
  box-shadow:0 10px 30px rgba(0,0,0,0.45);
}
.info-pop .ip-formula{font-family:var(--font-mono); font-size:11px; color:var(--text); background:var(--panel); border:1px solid var(--border-soft); border-radius:5px; padding:6px 8px; margin-bottom:8px;}
.info-pop .ip-text{font-size:11.5px; color:var(--text-dim); line-height:1.55;}

.secondary-row{display:flex; gap:10px; margin:14px 0 22px; flex-wrap:wrap;}
.sec-chip{
  border:1px solid var(--border); background:var(--panel); border-radius:20px; padding:7px 14px;
  font-size:11.5px; color:var(--text-dim); display:flex; align-items:center; gap:7px;
}
.sec-chip.active{border-color:var(--text-dim); color:var(--text); background:var(--panel-alt);}
.sec-chip b{color:var(--text); font-family:var(--font-head);}

/* filter bar */
.filterbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; background:var(--panel);
  border:1px solid var(--border); border-radius:8px; margin-bottom:16px;
}
.search-input{
  background:var(--panel-alt); border:1px solid var(--border); border-radius:6px; color:var(--text);
  padding:9px 12px; font-size:12.5px; width:220px; outline:none;
}
.search-input:focus{border-color:var(--amber);}
.supplier-select{
  background:var(--panel-alt); border:1px solid var(--border); border-radius:6px; color:var(--text);
  padding:9px 10px; font-size:12.5px; max-width:200px; outline:none; font-family:var(--font-mono);
}
.supplier-select:focus{border-color:var(--amber);}
.chip-scroll{display:flex; gap:6px; flex-wrap:wrap; flex:1; max-height:74px; overflow-y:auto; align-content:flex-start; padding-right:4px;}
.fam-chip{
  border:1px solid var(--border); background:var(--panel-alt); color:var(--text-dim); border-radius:5px;
  padding:6px 10px; font-size:11px; font-family:var(--font-head); font-weight:600; letter-spacing:0.02em;
}
.fam-chip.on{border-color:var(--amber); color:var(--amber); background:rgba(242,169,59,0.08);}
.filterbar-right{display:flex; align-items:center; gap:8px; margin-left:auto;}
.scope-toggle{display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden;}
.scope-toggle button{border:none; background:var(--panel-alt); color:var(--text-dim); padding:8px 12px; font-size:11.5px; font-family:var(--font-head); font-weight:600;}
.scope-toggle button.on{background:var(--amber); color:#1a1305;}

/* table */
.list-wrap{border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--panel);}
.list-head{
  display:grid; grid-template-columns: 118px 1.4fr 1.1fr 100px 110px 150px 110px 24px;
  gap:10px; padding:10px 16px; background:var(--panel-alt); border-bottom:1px solid var(--border);
  font-family:var(--font-head); font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint);
}
.list-row{
  display:grid; grid-template-columns: 118px 1.4fr 1.1fr 100px 110px 150px 110px 24px;
  gap:10px; padding:12px 16px; border-bottom:1px solid var(--border-soft); align-items:center; cursor:pointer;
  transition:background .1s;
}
.list-row:last-child{border-bottom:none;}
.list-row:hover{background:var(--panel-alt);}
.cell-pn{font-weight:600; font-size:12.5px; display:flex; align-items:center; gap:2px;}
.copy-btn{
  background:none; border:none; color:var(--text-faint); width:20px; height:20px; border-radius:4px;
  display:flex; align-items:center; justify-content:center; flex:none; padding:0;
}
.copy-btn svg{width:13px; height:13px;}
.copy-btn:hover{color:var(--text); background:var(--panel-raised);}
.copy-btn.copied{color:var(--green);}
.cell-pn .owner-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px;}
.cell-pn .cat-dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:5px;}
.all-mode-banner{
  display:flex; align-items:center; gap:8px; padding:10px 16px; background:var(--panel-alt);
  border-bottom:1px solid var(--border); font-size:11.5px; color:var(--text-dim);
}
.all-mode-banner svg{width:14px; height:14px; color:var(--text-faint); flex:none;}
.cell-proj{display:flex; gap:5px; flex-wrap:wrap;}
.tag{font-size:10px; padding:2px 6px; border-radius:3px; background:var(--panel-raised); color:var(--text-dim); font-family:var(--font-head); font-weight:600;}
.cell-supplier{font-size:11.5px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cell-num{font-size:12px; text-align:right; font-variant-numeric:tabular-nums;}
.cell-metric{font-size:12px; text-align:right;}
.cell-metric .m-main{font-weight:700; font-family:var(--font-head); font-size:13px;}
.cell-metric .m-sub{color:var(--text-faint); font-size:10px;}
.cell-spark{display:flex; align-items:center; justify-content:flex-end;}
.cell-arrow{color:var(--text-faint); text-align:right;}
.empty-state{padding:60px 20px; text-align:center; color:var(--text-faint); font-size:12.5px;}
.empty-state svg{width:32px; height:32px; margin:0 auto 12px; opacity:0.5;}

.list-footer{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; font-size:11.5px; color:var(--text-faint);}

/* ================= DETAIL DRAWER ================= */
.overlay{position:fixed; inset:0; background:rgba(8,10,14,0.6); z-index:90; backdrop-filter:blur(2px);}
.drawer{
  position:fixed; top:0; right:0; height:100vh; width:min(680px, 100vw); background:var(--panel);
  border-left:1px solid var(--border); z-index:100; overflow-y:auto; box-shadow:-20px 0 50px rgba(0,0,0,0.5);
}
.drawer-head{padding:20px 24px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:flex-start; position:sticky; top:0; background:var(--panel); z-index:5;}
.drawer-pn{font-family:var(--font-head); font-size:22px; font-weight:700;}
.drawer-tags{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
.drawer-close{background:var(--panel-raised); border:1px solid var(--border); border-radius:6px; width:32px; height:32px; color:var(--text-dim); flex:none;}
.drawer-body{padding:22px 24px 60px;}
.dr-section{margin-bottom:26px;}
.dr-section h4{font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-faint); margin-bottom:12px;}
.status-banner{
  border-radius:8px; padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:20px; border:1px solid;
}
.status-banner .sb-icon{width:20px; height:20px; flex:none;}
.status-banner .sb-title{font-family:var(--font-head); font-weight:700; font-size:14px;}
.status-banner .sb-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
.kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.kpi-box{border:1px solid var(--border); border-radius:6px; padding:12px; background:var(--panel-alt);}
.kpi-box .k-label{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; font-family:var(--font-head);}
.kpi-box .k-val{font-family:var(--font-head); font-size:18px; font-weight:700; margin-top:4px;}
.kpi-box .k-detail{font-size:10px; color:var(--text-faint); margin-top:3px;}
.raben-note{
  display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-dim);
  background:var(--panel-alt); border:1px solid var(--border-soft); border-radius:6px; padding:9px 12px; margin-bottom:24px;
}
.raben-note svg{width:14px; height:14px; flex:none; color:var(--text-faint);}
.raben-note b{color:var(--text); font-weight:600;}
.chart-legend{display:flex; gap:16px; margin-bottom:8px; flex-wrap:wrap;}
.chart-legend .lg-item{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--text-dim);}
.lg-swatch{width:10px; height:10px; border-radius:2px;}
.info-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 20px;}
.info-item{border-bottom:1px solid var(--border-soft); padding-bottom:8px;}
.info-item .i-label{font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; font-family:var(--font-head);}
.info-item .i-val{font-size:12.5px; margin-top:3px; word-break:break-word;}
.oo-table{width:100%; border-collapse:collapse; font-size:11.5px;}
.oo-table th{text-align:left; color:var(--text-faint); font-family:var(--font-head); font-weight:600; text-transform:uppercase; font-size:9.5px; letter-spacing:0.05em; padding:6px 8px; border-bottom:1px solid var(--border);}
.oo-table td{padding:7px 8px; border-bottom:1px solid var(--border-soft);}
.oo-empty{color:var(--text-faint); font-size:12px; padding:10px 0;}
.chart-fallback{
  display:flex; align-items:flex-start; gap:10px; color:var(--text-dim); font-size:12px; line-height:1.6;
  background:var(--panel-alt); border:1px solid var(--border-soft); border-radius:6px; padding:14px 16px;
}

.hidden{display:none !important;}

canvas{max-width:100%;}

.lang-btn.on{background:var(--panel-raised); color:var(--text);}

.edi-actions{display:flex; gap:6px; flex-wrap:wrap;}
.edi-actions .btn{padding:7px 12px; font-size:11.5px; display:inline-flex; align-items:center; gap:6px; text-transform:none; letter-spacing:0.02em;}

.edi-verdict.warn{background:var(--amber-tint); border-color:rgba(242,169,59,0.4); color:var(--text);}

.edi-verdict.bad{background:var(--red-tint); border-color:rgba(240,80,63,0.4); color:var(--text);}
.edi-verdict.bad svg{color:var(--red);}

.edi-cell{

.edi-cell.st-demand{border-color:rgba(167,139,250,0.55); background:rgba(167,139,250,0.06);}
.edi-cell.st-transport{border-color:rgba(242,169,59,0.55); background:rgba(242,169,59,0.06);}
.edi-cell.st-rupture{border-color:rgba(240,80,63,0.6); background:rgba(240,80,63,0.07);}

.edi-existing{font-size:9.5px; color:var(--text-faint); white-space:nowrap; min-height:12px;}

.ov-row{border-bottom:1px solid var(--border-soft); cursor:pointer; transition:background .1s;}
.ov-row:last-child{border-bottom:none;}
.ov-row:hover{background:var(--panel-alt);}
.ov-owner{display:flex; align-items:center; gap:10px;}
.ov-owner-name{font-family:var(--font-head); font-weight:600; font-size:13px;}
.ov-owner-sub{font-size:10px; color:var(--text-faint); margin-top:2px;}
.ov-bar-cell{display:flex; align-items:center;}
.ov-bar-wrap{min-width:40px; width:100%;}
.ov-barplot{border:1px solid var(--border-soft); border-radius:8px; padding:12px; background:var(--panel-alt);}
.ov-num-cell{text-align:right; font-size:13px; font-variant-numeric:tabular-nums;}
.ov-urgent{font-size:11px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ov-footnote{margin-top:12px; font-size:11.5px; color:var(--text-faint); text-align:center;}
@media (max-width: 1000px){
  .ov-head{display:none;}
  .ov-row{grid-template-columns:1fr; gap:6px; padding:14px 16px;}
  .ov-num-cell{text-align:left;}
  .ov-num-cell::before{content:attr(data-label); color:var(--text-faint); margin-right:6px;}
}

@media (max-width: 860px){
  .andon-row{grid-template-columns:repeat(2,1fr);}
  .list-head{display:none;}
  .list-row{grid-template-columns:1fr; gap:4px; padding:14px 16px;}
  .cell-num,.cell-metric,.cell-arrow{text-align:left;}
  .cell-spark{display:none;}
  .info-grid{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
}

function fmtNum(n){

function fmtAxis(n){

  if(n===null||n===undefined||isNaN(n)) return '';
  const a = Math.abs(n), sign = n<0 ? '-' : '';
  if(a>=1e6) return sign + (a/1e6).toLocaleString(LOCALE(),{maximumFractionDigits:1}) + 'M';
  if(a>=1e4) return sign + Math.round(a/1e3).toLocaleString(LOCALE()) + 'k';
  if(a>=1e3) return sign + (a/1e3).toLocaleString(LOCALE(),{maximumFractionDigits:1}) + 'k';
  return sign + Math.round(a).toLocaleString(LOCALE());
}

function fmtEur(n){

  if(Math.abs(n)>=1000000) return (n/1000000).toLocaleString(LOCALE(),{maximumFractionDigits:1})+' M€';
  if(Math.abs(n)>=1000) return (n/1000).toLocaleString(LOCALE(),{maximumFractionDigits:0})+' k€';

}
function isNumericStr(s){ if(s==null) return false; const t=String(s).trim(); if(t==='') return false; return !isNaN(Number(t)); }
/* ---------------------------- FILE CALENDAR ----------------------------
   Every date the app computes (chart axis, "stock hits zero around…", plant arrivals) is anchored on
   the week dates written in the Need sheet, not on the day the file is opened. That keeps them
   consistent with the delivery dates read from the file, including when an older export or the demo
   is opened. Stock point i is the stock at the close of a week, labelled with the Monday that follows:
   point 0 is "now" for the file's own week. If the file's dates can't be read, the calendar falls
   back to today, which gives the same result for the current week's export.
   ----------------------------------------------------------------------------------------------- */
const MONTH_KEYS = [['juin',5],['juil',6],['jan',0],['gen',0],['ene',0],['feb',1],['fev',1],['mar',2],['apr',3],['avr',3],['abr',3],
  ['may',4],['mai',4],['mag',4],['jun',5],['giu',5],['jul',6],['lug',6],['aug',7],['aou',7],['ago',7],['sep',8],['set',8],
  ['oct',9],['ott',9],['nov',10],['dec',11],['dic',11]];
function isoWeekNum(d){
  const u = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = u.getUTCDay() || 7;
  u.setUTCDate(u.getUTCDate() + 4 - day);
  return Math.ceil((((u - Date.UTC(u.getUTCFullYear(),0,1)) / 86400000) + 1) / 7);
}
// Parses a week date as it appears in the file ("17-Aug", "17 août", "17/08/2026", "2026-08-17", an Excel
// serial). The usual export shows no year: we take the most recent year in which that day falls in the
// week number written next to it.
function parseFileDate(txt, weekNum){
  const raw = String(txt==null?'':txt).trim();
  if(!raw) return null;
  let m;
  if((m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], +m[2]-1, +m[3]);
  if(/^\d{5}$/.test(raw)){ const u = new Date(Date.UTC(1899,11,30) + (+raw)*86400000); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); }
  let day, month, year = null;
  if((m = raw.match(/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?$/))){ day=+m[1]; month=+m[2]-1; if(m[3]) year=+m[3]; }
  else if((m = raw.match(/^(\d{1,2})[\s\-\/.]*([^\d\s\-\/.,]+)[\s\-\/.,]*(\d{2,4})?$/))){
    const name = m[2].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const hit = MONTH_KEYS.find(([k])=> name.startsWith(k));
    if(!hit) return null;
    day=+m[1]; month=hit[1]; if(m[3]) year=+m[3];
  } else return null;
  if(month<0 || month>11 || day<1 || day>31) return null;
  if(year!==null) return new Date(year<100 ? 2000+year : year, month, day);
  // A planning file is this week's export or an older one, never one from far in the future: take the
  // most recent matching date that is not more than ~2 months ahead of today.
  const latest = Date.now() + 60*86400000;
  const thisYear = new Date().getFullYear();
  let best=null, bestScore=Infinity;
  for(let y=thisYear-12; y<=thisYear+1; y++){
    const d = new Date(y, month, day);
    if(d.getMonth()!==month || d.getTime()>latest) continue; // 29 Feb in a non-leap year, or too far ahead
    const weekMatches = weekNum!=null && isoWeekNum(d)===weekNum;
    const score = (latest - d.getTime()) + (weekMatches ? 0 : 1e15);
    if(score<bestScore){ bestScore=score; best=d; }
  }
  return best;
}
function setFileCalendar(needMap){
  state.calendar = null;
  const first = needMap[Object.keys(needMap)[0]];
  if(!first || !first.weeklyNeed.length) return;
  const w0 = first.weeklyNeed[0];
  const weekNum = extractWeekNum(w0.label);
  const weekStart = parseFileDate(w0.date, weekNum);
  if(!weekStart) return;
  // Consumption week j is deducted at stock index j + weekOffset, i.e. that point is the stock at the
  // close of week j, dated the following Monday.
  const anchor = new Date(weekStart);
  anchor.setDate(anchor.getDate() + (1 - (first.weekOffset||0))*7);
  state.calendar = { anchor, weekStart, weekNum: weekNum!=null ? weekNum : isoWeekNum(weekStart) };
}
function stockDateObj(i){
  const d = state.calendar ? new Date(state.calendar.anchor) : new Date();
  d.setDate(d.getDate() + i*7);
  return d;
}
// Date of stock point i (see FILE CALENDAR above).
function stockDate(i){ return stockDateObj(i).toLocaleDateString(LOCALE(), {day:'2-digit', month:'short'}); }
// A delivery that lands in stock point landIdx reached the plant during the week before that point's date.

function ownerColor(name){
  if(!name) return '#6b7480';
  let hash=0; for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return OWNER_COLORS[Math.abs(hash) % OWNER_COLORS.length];
}
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();

function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(c => {
    const s = (c===null||c===undefined) ? '' : String(c);
    return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------------------- FAMILY NORMALIZATION ---------------------------- */
function normalizeFamilies(rawProject){
  if(!rawProject) return ['Non catégorisé'];
  const parts = rawProject.split('/').map(s=>s.trim()).filter(Boolean);
  const out = new Set();
  parts.forEach(p=>{
    if(p==='0') out.add('Non catégorisé');
    else out.add(p);
  });
  if(out.size===0) out.add('Non catégorisé');
  return [...out];
}

/* ---------------------------- CSV PARSING ---------------------------- */
function parseCSVText(text){
  if(typeof Papa === 'undefined'){
    throw new Error(t('err_csv_lib'));
  }
  return Papa.parse(text, { skipEmptyLines:false }).data;
}

function detectFileKind(rows){
  for(let i=0;i<Math.min(rows.length,60);i++){
    const row = rows[i] || [];
    if(row.some(c => (c||'').trim()==='Appro') && row[0] && row[0].trim()==='PN') return 'master';
    if(row.some(c => (c||'').trim()==='Material')) return 'openOrders';
    if(row[0] && row[0].trim()==='PN' && row.some(c=>/^CW\s*\d+/i.test((c||'').trim()))) return 'need';
  }
  return null;
}

function extractWeekNum(label){
  const m = String(label).match(/(\d+)\s*$/);
  return m ? parseInt(m[1],10) : null;
}
function weekDiffMod(a,b){ // a-b, assuming a ~52-week annual cycle (handles year-end wraparound)
  let d = a-b;
  if(d>26) d-=52;
  if(d<-26) d+=52;
  return d;
}

function parseNeed(rows){
  let headerIdx=-1;
  for(let i=0;i<rows.length;i++){ if(rows[i][0] && rows[i][0].trim()==='PN'){ headerIdx=i; break; } }
  if(headerIdx===-1) throw new Error(t('err_need_struct'));
  const header = rows[headerIdx].map(c=>(c||'').trim());
  const dateRow = rows[headerIdx-1] || [];
  const cwCols=[];
  header.forEach((hh,idx)=>{ if(/^CW\s*\d+/i.test(hh)) cwCols.push({idx,label:hh,date:(dateRow[idx]||'').trim()}); });
  const rabenIdx = header.indexOf('Raben');
  const statusIdx = header.indexOf('Status');
  const allStockIdx = header.indexOf('All Stock');
  const need14Idx = header.indexOf('Need Of 14 Weeks');
  const allNeedIdx = header.indexOf('All Need');
  const projCols=[];
  if(rabenIdx>-1 && statusIdx>-1){
    for(let idx=rabenIdx+1; idx<statusIdx; idx++){ if(isNumericStr(header[idx])) projCols.push({idx,label:header[idx].trim()}); }
  }
  // The consumption table (CW ...) and the stock-projection table don't always start on the same
  // week: sometimes the consumption table starts one week later than the projection table (the
  // projection's first column is then a pre-consumption baseline). We detect this from the actual
  // week-number labels each time a file is loaded, rather than assuming either layout, so the app
  // keeps working whichever convention that week's export uses.
  let weekOffset = 0;
  if(cwCols.length && projCols.length){
    const cwFirst = extractWeekNum(cwCols[0].label);
    const projFirst = extractWeekNum(projCols[0].label);
    if(cwFirst!==null && projFirst!==null) weekOffset = weekDiffMod(cwFirst, projFirst);
  }
  const items={};
  for(let r=headerIdx+1;r<rows.length;r++){
    const row = rows[r];
    if(!row || !row[0] || !row[0].trim()) continue;
    const pn = row[0].trim();
    // Only raw materials (PN starting with "1"): finished/semi-finished goods (starting with 5, U, Z…)
    // aren't relevant to this tool and are dropped here.
    if(pn[0]!=='1') continue;
    const weeklyNeed = cwCols.map(c=>({label:c.label.trim(), date:c.date, value:parseFloat(row[c.idx])||0}));
    const projection = projCols.map(c=>({label:c.label, value:parseFloat(row[c.idx])||0}));
    const sumW = weeklyNeed.reduce((a,b)=>a+b.value,0);
    const avgWeeklyNeed = weeklyNeed.length ? sumW/weeklyNeed.length : 0;
    const allStock = allStockIdx>-1 ? (parseFloat(row[allStockIdx])||0) : 0;
    const raben = rabenIdx>-1 ? (parseFloat(row[rabenIdx])||0) : 0;
    // Note: the calendar's own baseline (first projection column) only counts stock physically at
    // the plant: it excludes material already secured and sitting at Raben (in transit). We do NOT
    // edit the calendar itself (it's the source of truth for rupture/overstock), but we track
    // allStock+raben separately as "current stock" for display and coverage purposes, so it doesn't
    // misleadingly read as 0 for items that are in fact covered.
    items[pn] = {
      pn, weeklyNeed, projection, weekOffset,
      need14: need14Idx>-1 ? (parseFloat(row[need14Idx])||0) : 0,
      allNeed: allNeedIdx>-1 ? (parseFloat(row[allNeedIdx])||0) : 0,
      allStock, raben,
      statusRaw: statusIdx>-1 ? (row[statusIdx]||'').trim() : '',
      avgWeeklyNeed,
    };
  }
  if(Object.keys(items).length===0) throw new Error(t('err_need_empty'));
  return items;
}

function parseMaster(rows){
  let headerIdx=-1;
  for(let i=0;i<rows.length;i++){ if(rows[i][0] && rows[i][0].trim()==='PN' && rows[i].some(c=>(c||'').trim()==='Appro')){ headerIdx=i; break; } }
  if(headerIdx===-1) throw new Error(t('err_master_struct'));
  const header = rows[headerIdx].map(c=>(c||'').trim());
  const col = n => header.indexOf(n);
  const idx = {
    pn:col('PN'), statusTag:col('Status'), sa:col('SA'), active:col('Active / No'), appro:col('Appro'),
    supplierPn:col('Supplier PN'), cat:col('Cat'), supplier:col('supplier'), project:col('Project'),
    supplierLoc:col('Supplier Location'), leadTime:col('Lead Time'), moq:col('MOQ'), lotSize:col('Lot Size'),
    incoterm:col('Incoterm'), eta:col('ETA'), contact:col('Contact Person'), comment:col('Comment'), price:col('mm60'),
  };
  const items={};
  const get = (row,i) => i>-1 ? (row[i]||'').trim() : '';
  const getPrice = (row,i) => {
    if(i<0 || !row[i]) return 0;
    let cleaned = String(row[i]).replace(/€/g,'').replace(/\s/g,'').trim();
    if(cleaned==='' || cleaned==='-') return 0;
    const lastDot = cleaned.lastIndexOf('.'), lastComma = cleaned.lastIndexOf(',');
    if(lastDot>-1 && lastComma>-1){
      // both present: the last one is the decimal mark, the other groups thousands
      cleaned = lastDot>lastComma ? cleaned.replace(/,/g,'') : cleaned.replace(/\./g,'').replace(',','.');
    } else {
      cleaned = cleaned.replace(',','.');
    }
    const v = parseFloat(cleaned);
    return isNaN(v) ? 0 : v;
  };
  for(let r=headerIdx+1;r<rows.length;r++){
    const row = rows[r];
    if(!row || !get(row,idx.pn)) continue;
    const pn = get(row,idx.pn);
    items[pn] = {
      pn, statusTag:get(row,idx.statusTag), sa:get(row,idx.sa), active:get(row,idx.active),
      owner:get(row,idx.appro), supplierPn:get(row,idx.supplierPn), cat:get(row,idx.cat),
      supplier:get(row,idx.supplier), project:get(row,idx.project), supplierLoc:get(row,idx.supplierLoc),
      leadTime:get(row,idx.leadTime), moq:get(row,idx.moq), lotSize:get(row,idx.lotSize),
      incoterm:get(row,idx.incoterm), eta:get(row,idx.eta), contact:get(row,idx.contact), comment:get(row,idx.comment),
      price: getPrice(row,idx.price),
    };
  }
  if(Object.keys(items).length===0) throw new Error(t('err_master_empty'));
  return items;
}

function parseOpenOrders(rows){
  let headerIdx=-1;
  for(let i=0;i<rows.length;i++){ if(rows[i].some(c=>(c||'').trim()==='Material')){ headerIdx=i; break; } }
  if(headerIdx===-1) throw new Error(t('err_oo_struct'));
  const header = rows[headerIdx].map(c=>(c||'').trim());
  const dateRow = rows[headerIdx-1] || [];
  const materialIdx = header.indexOf('Material');
  const saIdx = header.indexOf('SA');
  const supplierIdx = header.indexOf('Supplier');
  const backlogIdx = header.indexOf('Backlog');
  const weekCols=[];
  header.forEach((hh,idx)=>{ if(idx>backlogIdx && isNumericStr(hh)) weekCols.push({idx,label:hh.trim(),date:(dateRow[idx]||'').trim()}); });
  const byPn={};
  for(let r=headerIdx+1;r<rows.length;r++){
    const row = rows[r];
    if(!row || !row[materialIdx] || !row[materialIdx].trim()) continue;
    const pn = row[materialIdx].trim();
    const backlog = backlogIdx>-1 ? (parseFloat(row[backlogIdx])||0) : 0;
    const weeks = weekCols.map(c=>({label:c.label,date:c.date,qty:parseFloat(row[c.idx])||0})).filter(w=>w.qty>0);
    if(!byPn[pn]) byPn[pn]=[];
    byPn[pn].push({ sa: saIdx>-1?(row[saIdx]||'').trim():'', supplier: supplierIdx>-1?(row[supplierIdx]||'').trim():'', backlog, weeks });
  }
  return byPn;
}

/* ---------------------------- BUILD DATASET ---------------------------- */
// Rupture and overstock read the prevision calendar as-is (it already bakes in stock,
// consumption and planned EDIs): nothing is reconstructed for those two.
//
// For the safety-stock check specifically, we simulate "what if every EDI lands 2 weeks
// later than currently planned" using the real Open Orders data:
//   1) Find where each EDI already sits in the calendar (matched by date to the Need week
//      dates: the two files use different week-numbering conventions but the same calendar
//      dates, so date-matching sidesteps that entirely) and remove it from that point on
//      (the calendar is a running balance, so removing an arrival shifts everything after it
//      down by that amount, until it's added back).
//   2) Add the same quantity back in 2 weeks later than that.
// If the resulting calendar dips below zero anywhere, the item doesn't have enough buffer to
// absorb a 2-week EDI slip: that's what "sous stock de sécurité" means here.
const RABEN_TO_PLANT_WEEKS = 1; // fixed business transit time, independent of file layout
function buildEDIDelayCalendar(it, shiftWeeks){
  const n = it.projection.length;
  const dateToIndex = {};
  const structOffset = it.weekOffset || 0; // detected per-file: how the consumption table's week 0 lines up with the projection table's week 0
  it.weeklyNeed.forEach((w,j)=>{ if(w.date) dateToIndex[w.date] = j + structOffset + RABEN_TO_PLANT_WEEKS; });
  const delta = new Array(n).fill(0);
  (it.openOrders||[]).forEach(po=>{
    po.weeks.forEach(w=>{
      if(w.qty<=0) return;
      const origIdx = dateToIndex[w.date];
      if(origIdx===undefined || origIdx<0) return; // EDI dated outside the visible horizon, not in the calendar we can see
      delta[origIdx] -= w.qty;
      const newIdx = origIdx + shiftWeeks;
      if(newIdx < n) delta[newIdx] += w.qty;
      // if the delay pushes it past the visible horizon, it conservatively stays "not arrived"
    });
  });
  const adjusted = new Array(n);
  let cum = 0;
  for(let i=0;i<n;i++){ cum += delta[i]; adjusted[i] = it.projection[i].value + cum; }
  return adjusted;
}

/* ---------------------------- EDI PLANNER ----------------------------
   Lets the user sketch new EDIs (one qty per EDI week) and see, live, whether the resulting
   plan clears BOTH safety tests independently:
     - transport: with all EDIs (existing + new) delayed by SETTINGS.safetyDelayWeeks, stock never < 0
     - demand:    with EDIs on time, stock never < demandSpikeThreshold (2x peak near-term need)
   The two are checked separately, never stacked: an item must survive one OR the other.
   EDI weeks are expressed in the Open Orders convention (arrival at Raben); goods reach the plant
   RABEN_TO_PLANT_WEEKS later, which is where they show up on the stock calendar.
   ------------------------------------------------------------------------------------------- */
function getEdiWeeks(it){
  const n = it.projection.length;
  const off = (it.weekOffset||0) + RABEN_TO_PLANT_WEEKS;
  const out = [];
  it.weeklyNeed.forEach((w,j)=>{
    const landIdx = j + off;
    if(landIdx < n) out.push({ j, date: w.date, label: w.label, landIdx });
  });
  return out;
}

function simulatePlan(it, qtyByJ){
  const n = it.projection.length;
  const off = (it.weekOffset||0) + RABEN_TO_PLANT_WEEKS;
  const delay = SETTINGS.safetyDelayWeeks;
  const baseDelta = new Array(n).fill(0), delayDelta = new Array(n).fill(0);
  (qtyByJ||[]).forEach((q,j)=>{
    if(!q || q<=0) return;
    const k = j + off;
    if(k < n) baseDelta[k] += q;
    const kd = k + delay;
    if(kd < n) delayDelta[kd] += q;
  });
  const origDelayed = buildEDIDelayCalendar(it, delay);
  const baseline = new Array(n), delayed = new Array(n);
  let cb = 0, cd = 0;
  for(let i=0;i<n;i++){
    cb += baseDelta[i]; cd += delayDelta[i];
    baseline[i] = it.projection[i].value + cb;
    delayed[i]  = origDelayed[i] + cd;
  }
  const threshold = it.demandSpikeThreshold || 0;
  const weekStatus = [];
  let firstFail = null, failCount = 0, unfixable = 0;
  for(let i=0;i<n;i++){
    const EPS = 1e-6; // float tolerance: cumulative sums vs. threshold can differ on the last decimal
    const failDemand = baseline[i] < threshold - EPS;
    const failTransport = delayed[i] < -EPS;
    let s = 'ok';
    if(baseline[i] < -EPS) s = 'rupture';
    else if(failTransport) s = 'transport';
    else if(failDemand) s = 'demand';
    weekStatus.push(s);
    if(s!=='ok'){
      failCount++;
      if(firstFail===null) firstFail = i;
      // weeks that no new EDI can reach (before the first possible landing, or before the first
      // possible delayed landing for a transport fail) are structurally unfixable from here
      if(i < off || (s==='transport' && i < off + delay)) unfixable++;
    }
  }
  const totalQty = (qtyByJ||[]).reduce((s,q)=>s+(q>0?q:0),0);
  return { baseline, delayed, threshold, weekStatus, ok: failCount===0, firstFail, failCount, unfixable, totalQty };
}

// Pick a "round number" unit that matches how this item is usually ordered: one order of magnitude
// under its peak weekly need (37k/week → order in 1 000s; 130k/week → 10 000s; 500/week → 10s).
function niceUnitFor(it){
  const peak = Math.max(...it.weeklyNeed.map(w=>w.value), it.avg||0, 1);
  const mag = Math.pow(10, Math.max(1, Math.floor(Math.log10(peak)) - 1));
  return Math.min(Math.max(mag, 10), 10000);
}
function roundUpTo(v, unit){ return unit>0 ? Math.ceil(v/unit - 1e-9)*unit : v; }

// Greedy just-in-time minimum: walk EDI weeks in order; at each one, add exactly what's needed for
// the constraint weeks that THIS EDI is the last one able to help (its own landing week for demand,
// its own delayed-landing week for transport: plus everything to the horizon for the last EDI).
// Adding at the last possible moment is what makes the total minimal. Optionally rounds each week's
// qty up to `unit` before applying it, so the surplus carries forward (which naturally produces the
// "20 000 · 0 · 0 · 20 000" cadence seen in the real EDIs).
function computeMinPlan(it, unit, basePlan){
  const n = it.projection.length;
  const off = (it.weekOffset||0) + RABEN_TO_PLANT_WEEKS;
  const delay = SETTINGS.safetyDelayWeeks;
  const threshold = it.demandSpikeThreshold || 0;
  const weeks = getEdiWeeks(it);
  const baseline = it.projection.map(p=>p.value);
  const delayed = buildEDIDelayCalendar(it, delay).slice();
  // If the user already sketched some EDIs, bake them in first: the result is then "what's STILL
  // missing per week on top of what you typed", which is what the live "+ à ajouter" hint shows.
  if(basePlan){
    basePlan.forEach((q,j)=>{
      if(!q || q<=0) return;
      const k = j + off, kd = k + delay;
      for(let i=k;i<n;i++) baseline[i] += q;
      for(let i=kd;i<n;i++) delayed[i] += q;
    });
  }
  const plan = new Array(it.weeklyNeed.length).fill(0);
  const lastJ = weeks.length ? weeks[weeks.length-1].j : -1;
  // last EDI whose delayed landing is still inside the horizon
  let lastDelayJ = -1;
  weeks.forEach(w=>{ if(w.landIdx + delay < n) lastDelayJ = w.j; });
  weeks.forEach(w=>{
    const k = w.landIdx, kd = k + delay;
    let need = 0;
    // demand constraint: this EDI is the last helper for its landing week (or the whole tail if last)
    const baseTo = (w.j===lastJ) ? n : Math.min(n, k+1);
    for(let i=k;i<baseTo;i++){ need = Math.max(need, threshold - baseline[i]); }
    // transport constraint: last helper for its delayed landing week (or the whole tail if last-with-delay)
    if(kd < n){
      const delTo = (w.j===lastDelayJ) ? n : Math.min(n, kd+1);
      for(let i=kd;i<delTo;i++){ need = Math.max(need, 0 - delayed[i]); }
    }
    let q = need > 1e-9 ? need + 1e-6 : 0; // tiny bump so we land strictly above the line, not on it
    if(q>0 && unit) q = roundUpTo(q, unit);
    if(q>0){
      plan[w.j] = q;
      for(let i=k;i<n;i++) baseline[i] += q;
      for(let i=kd;i<n;i++) delayed[i] += q;
    }
  });
  return plan;
}

function categorize(it){
  const avg = it.avgWeeklyNeed;
  const current = it.allStock + (it.raben||0); // stock actuel = à l'usine + déjà sécurisé au Raben
  const price = it.price || 0;
  // Value of stock sitting in the calendar, summed across the whole 36-week horizon (not just a
  // snapshot): a big number here means either a lot of money per unit, or units sitting for a long
  // time, or both. That's what "surstock" is meant to catch: capital immobilized, not just a peak week.
  const overstockValue = it.projection.reduce((s,p)=> s + Math.max(0,p.value), 0) * price;
  if(avg <= 0){
    const category = current>0 ? (overstockValue>SETTINGS.overstockValueThreshold ? 'OVERSTOCK' : 'SWEET_SPOT') : 'INACTIVE';
    return {
      category, weeksToRupture:null, overstockValue, coverageNow: current>0?Infinity:0, current, avg, delayedStock:null,
      farRupture:false, weeksToUnderSafetyTransport:null, farUnderSafetyTransport:false,
      weeksToUnderSafetyDemand:null, farUnderSafetyDemand:false, demandSpikeThreshold:0,
    };
  }
  // 1) Rupture: does the calendar, exactly as planned, ever go negative? (strictly < 0: reaching
  //    exactly 0 is "just enough", not a rupture; matches how the source file's own status is set)
  let weeksToRupture=null;
  for(let i=0;i<it.projection.length;i++){ if(it.projection[i].value<0){ weeksToRupture=i; break; } }

  // Only a rupture within the near-term horizon (default 12 weeks / ~3 months) counts as urgent.
  // A rupture further out than that isn't actionable right now: file it under "zone saine" instead,
  // flagged so it's still visible, rather than crowding the urgent list with things 6+ months away.
  const nearRupture = weeksToRupture!==null && weeksToRupture<=SETTINGS.ruptureHorizonWeeks;
  const farRupture = weeksToRupture!==null && weeksToRupture>SETTINGS.ruptureHorizonWeeks;

  // 2a) Safety-stock risk: TRANSPORT: EDIs delayed by SETTINGS.safetyDelayWeeks (via the real
  //     Open Orders data). Only worth checking if the baseline plan has NO rupture anywhere in the
  //     visible horizon: a far rupture (>12 weeks) already tells us there's a known future issue;
  //     running the delay test on top of that would just relabel it instead of surfacing it cleanly
  //     as "rupture lointaine" under zone saine.
  let weeksToUnderSafetyTransport=null, delayedStock=null;
  if(weeksToRupture===null){
    delayedStock = buildEDIDelayCalendar(it, SETTINGS.safetyDelayWeeks);
    for(let i=0;i<delayedStock.length;i++){ if(delayedStock[i]<0){ weeksToUnderSafetyTransport=i; break; } }
  }
  const nearUSTransport = weeksToUnderSafetyTransport!==null && weeksToUnderSafetyTransport<=SETTINGS.ruptureHorizonWeeks;
  const farUSTransport = weeksToUnderSafetyTransport!==null && weeksToUnderSafetyTransport>SETTINGS.ruptureHorizonWeeks;

  // 2b) Safety-stock risk: DEMAND: could the item absorb a sudden demand spike, at any week, worth
  //     2x the heaviest week of consumption expected over the next N weeks? Threshold = 2x the peak
  //     weekly need over that near-term window; flagged if the planned stock ever dips under it.
  //     Only checked for items that clear the rupture AND transport-delay tests, so each item lands
  //     in exactly one category.
  // 2b) Safety-stock risk: DEMAND: could the item absorb a sudden demand spike, at any week, worth
  //     2x the heaviest week of consumption expected over the next N weeks? Threshold = 2x the peak
  //     weekly need over that near-term window. Always computed (used as a reference line on the
  //     chart even for items classified elsewhere): only used for CATEGORY assignment when the item
  //     clears the rupture and transport-delay tests, so each item still lands in exactly one category.
  const nearWeeks = it.weeklyNeed.slice(0, SETTINGS.ruptureHorizonWeeks);
  const peakNearNeed = nearWeeks.length ? Math.max(...nearWeeks.map(w=>w.value)) : 0;
  const demandSpikeThreshold = SETTINGS.demandSpikeMultiplier * peakNearNeed;
  let weeksToUnderSafetyDemand=null;
  if(weeksToRupture===null && !nearUSTransport && !farUSTransport && demandSpikeThreshold>0){
    for(let i=0;i<it.projection.length;i++){ if(it.projection[i].value<demandSpikeThreshold){ weeksToUnderSafetyDemand=i; break; } }
  }
  const nearUSDemand = weeksToUnderSafetyDemand!==null && weeksToUnderSafetyDemand<=SETTINGS.ruptureHorizonWeeks;
  const farUSDemand = weeksToUnderSafetyDemand!==null && weeksToUnderSafetyDemand>SETTINGS.ruptureHorizonWeeks;

  const coverageNow = current/avg;
  let category;
  if(nearRupture) category='RUPTURE';
  else if(farRupture) category='SWEET_SPOT';
  else if(nearUSTransport) category='UNDER_SAFETY_TRANSPORT';
  else if(farUSTransport) category='SWEET_SPOT';
  else if(nearUSDemand) category='UNDER_SAFETY_DEMAND';
  else if(farUSDemand) category='SWEET_SPOT';
  else if(overstockValue>SETTINGS.overstockValueThreshold) category='OVERSTOCK';
  else category='SWEET_SPOT';
  return {
    category, weeksToRupture, overstockValue, coverageNow, current, avg, delayedStock,
    farRupture,
    weeksToUnderSafetyTransport, farUnderSafetyTransport: farUSTransport,
    weeksToUnderSafetyDemand, farUnderSafetyDemand: farUSDemand, demandSpikeThreshold,
  };
}

function buildDataset(needMap, masterMap, ooMap){
  const items=[];
  for(const pn in needMap){
    const need = needMap[pn];
    const master = masterMap[pn] || {};
    const openOrders = ooMap[pn] || [];
    const totalIncoming = openOrders.reduce((s,po)=> s + po.weeks.reduce((a,w)=>a+w.qty,0), 0);
    const calc = categorize({ projection: need.projection, weeklyNeed: need.weeklyNeed, avgWeeklyNeed: need.avgWeeklyNeed, allStock: need.allStock, raben: need.raben, price: master.price, weekOffset: need.weekOffset, openOrders });
    items.push({
      pn,
      owner: master.owner || 'Non assigné',
      families: normalizeFamilies(master.project),
      projectDetail: master.project || '',
      statusCategory: master.statusTag || '',
      supplier: master.supplier || need.supplier || '-',
      cat: master.cat || '',
      active: master.active || '',
      sa: master.sa || '',
      supplierPn: master.supplierPn || '',
      supplierLoc: master.supplierLoc || '',
      leadTime: master.leadTime || '',
      moq: master.moq || '',
      lotSize: master.lotSize || '',
      incoterm: master.incoterm || '',
      eta: master.eta || '',
      contact: master.contact || '',
      comment: master.comment || '',
      price: master.price || 0,
      weeklyNeed: need.weeklyNeed,
      weekOffset: need.weekOffset,
      projection: need.projection,
      allStock: need.allStock,
      raben: need.raben,
      current: calc.current,
      avg: calc.avg,
      category: calc.category,
      weeksToRupture: calc.weeksToRupture,
      weeksToUnderSafetyTransport: calc.weeksToUnderSafetyTransport,
      weeksToUnderSafetyDemand: calc.weeksToUnderSafetyDemand,
      demandSpikeThreshold: calc.demandSpikeThreshold,
      coverageNow: calc.coverageNow,
      overstockValue: calc.overstockValue,
      farRupture: calc.farRupture,
      farUnderSafetyTransport: calc.farUnderSafetyTransport,
      farUnderSafetyDemand: calc.farUnderSafetyDemand,
      openOrders, totalIncoming,
    });
  }
  // items present in master but absent from need (no forecast): keep as separate pool, not in main categories
  const noForecast=[];
  for(const pn in masterMap){
    if(needMap[pn]) continue;
    if(pn[0]!=='1') continue; // same raw-materials-only filter as Need: skip finished/semi-finished goods
    const master = masterMap[pn];
    noForecast.push({ pn, owner: master.owner||'Non assigné', families: normalizeFamilies(master.project), supplier: master.supplier||'-', active: master.active||'' });
  }
  return { items, noForecast };
}

/* ---------------------------- APP INIT / EVENTS ---------------------------- */
function setState(patch){ Object.assign(state, patch); render(); }

function findSheetByKeywords(workbook, keywords){
  const names = workbook.SheetNames;
  for(const kw of keywords){
    const exact = names.find(n => n.trim().toLowerCase() === kw);
    if(exact) return exact;
  }
  for(const kw of keywords){
    const partial = names.find(n => n.trim().toLowerCase().includes(kw));
    if(partial) return partial;
  }
  return null;
}

// Reads the three sheets of a workbook into state.files. Returns false (with state.parseError set) on failure.
function loadWorkbook(data, displayName){
  try{
    const workbook = XLSX.read(data, { type:'array', cellDates:false });
    const sheetMap = {
      need: findSheetByKeywords(workbook, ['need']),
      master: findSheetByKeywords(workbook, ['new r', 'new_r', 'newr']),
      openOrders: findSheetByKeywords(workbook, ['open orders', 'open_orders', 'openorders']),
    };
    const missing = Object.entries(sheetMap).filter(([k,v])=>!v);
    if(missing.length){
      const labels = { need:'Need', master:'New R', openOrders:'Open Orders' };
      state.parseError = t('err_sheets_missing', missing.map(([k])=>labels[k]).join(', '), workbook.SheetNames.join(', '));
      return false;
    }
    Object.entries(sheetMap).forEach(([kind, sheetName])=>{
      // Master data is read with raw numbers: the price column (mm60) is displayed with one decimal
      // in Excel, so its formatted text would turn a 0.04 € part into "0.0". The two other sheets keep
      // formatted text because their week dates ("17-Aug") are matched across sheets and shown as is.
      const csvText = XLSX.utils.sheet_to_csv(workbook.Sheets[sheetName], { blankrows:true, rawNumbers: kind==='master' });
      const rows = parseCSVText(csvText);
      state.files[kind] = rows;
      state.fileMeta[kind] = { name: `${displayName} → ${sheetName}`, size: csvText.length };
    });
    state.parseError = null;
    return true;
  } catch(err){
    state.parseError = t('err_xlsx_read', displayName, err.message);
    return false;
  }
}

function handleExcelFile(file){
  if(typeof XLSX === 'undefined'){
    state.parseError = t('err_xlsx_lib');
    render();
    return;
  }
  const reader = new FileReader();
  reader.onload = e => { loadWorkbook(new Uint8Array(e.target.result), file.name); render(); };
  reader.readAsArrayBuffer(file);
}

/* Demo: loads the synthetic sample shipped next to this page and goes straight to the app.
   Needs the page to be served over http(s) (GitHub Pages, any static server): browsers don't let a
   page opened from disk fetch a neighbouring file. Also triggered by adding ?demo to the URL. */
const DEMO_FILE = 'sample-data/supply_management_34-2026_sample.xlsx';
function loadDemo(){
  if(state.demoLoading) return;
  if(typeof XLSX === 'undefined'){ setState({ parseError: t('err_xlsx_lib') }); return; }
  setState({ demoLoading:true, parseError:null });
  fetch(DEMO_FILE)
    .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.arrayBuffer(); })
    .then(buf => {
      state.demoLoading = false;
      if(loadWorkbook(new Uint8Array(buf), DEMO_FILE.split('/').pop())){ state.demo = true; proceedFromUpload(); }
      else render();
    })
    .catch(() => setState({ demoLoading:false, parseError: t('err_demo_load', DEMO_FILE) }));
}

function handleFiles(fileList){
  const all = Array.from(fileList);
  const excelFiles = all.filter(f => /\.(xlsx|xls)$/i.test(f.name));
  const csvFiles = all.filter(f => /\.csv$/i.test(f.name));
  state.parseError = null;
  state.demo = false;
  excelFiles.forEach(f => handleExcelFile(f));
  if(csvFiles.length===0) return;
  let pending = csvFiles.length;
  csvFiles.forEach(f => {
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const rows = parseCSVText(e.target.result);
        const kind = detectFileKind(rows);
        if(!kind){
          state.parseError = t('err_file_unknown', f.name);
        } else {
          state.files[kind] = rows;
          state.fileMeta[kind] = { name: f.name, size: f.size };
        }
      } catch(err){
        state.parseError = t('err_file_read', f.name, err.message);
      }
      pending--;
      if(pending===0) render();
    };
    reader.readAsText(f, 'UTF-8');
  });
}

function proceedFromUpload(){
  try{
    const needMap = parseNeed(state.files.need);
    const masterMap = parseMaster(state.files.master);
    const ooMap = parseOpenOrders(state.files.openOrders);
    const { items, noForecast } = buildDataset(needMap, masterMap, ooMap);
    setFileCalendar(needMap);
    const owners = [...new Set(items.map(i=>i.owner).filter(o=>o && o!=='Non assigné'))].sort();
    setState({ screen:'user', items, noForecast, owners, parseError:null });
  } catch(err){
    setState({ parseError: t('err_processing', err.message) });
  }
}

function recomputeCategories(){
  state.items.forEach(it=>{
    const calc = categorize({ projection: it.projection, weeklyNeed: it.weeklyNeed, avgWeeklyNeed: it.avg, allStock: it.allStock, raben: it.raben, price: it.price, weekOffset: it.weekOffset, openOrders: it.openOrders });
    it.category = calc.category;
    it.weeksToRupture = calc.weeksToRupture;
    it.weeksToUnderSafetyTransport = calc.weeksToUnderSafetyTransport;
    it.weeksToUnderSafetyDemand = calc.weeksToUnderSafetyDemand;
    it.demandSpikeThreshold = calc.demandSpikeThreshold;
    it.coverageNow = calc.coverageNow;
    it.overstockValue = calc.overstockValue;
    it.farRupture = calc.farRupture;
    it.farUnderSafetyTransport = calc.farUnderSafetyTransport;
    it.farUnderSafetyDemand = calc.farUnderSafetyDemand;
  });
}

/* ---------------------------- FILTERING / SORTING ---------------------------- */
function getFilteredItems(){
  if(state.category==='NO_FORECAST'){
    let arr = state.noForecast;
    if(state.scope==='mine' && state.currentOwner) arr = arr.filter(i=>i.owner===state.currentOwner);
    if(state.familyFilter.size>0) arr = arr.filter(i=> i.families.some(f=>state.familyFilter.has(f)));
    if(state.supplierFilter) arr = arr.filter(i=> i.supplier===state.supplierFilter);
    if(state.search.trim()){
      const q = state.search.trim().toLowerCase();
      arr = arr.filter(i => i.pn.toLowerCase().includes(q) || i.supplier.toLowerCase().includes(q));
    }
    return arr.slice().sort((a,b)=> a.pn.localeCompare(b.pn));
  }
  let arr = state.items;
  if(state.scope==='mine' && state.currentOwner){
    arr = arr.filter(i=>i.owner===state.currentOwner);
  }
  if(state.category!=='ALL'){
    arr = arr.filter(i=>i.category===state.category);
  }
  if(state.familyFilter.size>0){
    arr = arr.filter(i=> i.families.some(f=>state.familyFilter.has(f)));
  }
  if(state.supplierFilter){
    arr = arr.filter(i=> i.supplier===state.supplierFilter);
  }
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    arr = arr.filter(i => i.pn.toLowerCase().includes(q) || i.supplier.toLowerCase().includes(q) || i.projectDetail.toLowerCase().includes(q));
  }
  const catPriority = { RUPTURE:0, UNDER_SAFETY_TRANSPORT:1, UNDER_SAFETY_DEMAND:2, OVERSTOCK:3, SWEET_SPOT:4, INACTIVE:5 };
  arr = arr.slice().sort((a,b)=>{
    if(state.category==='ALL'){
      if(a.category!==b.category) return (catPriority[a.category]??9) - (catPriority[b.category]??9);
      if(a.category==='RUPTURE') return (a.weeksToRupture-b.weeksToRupture) || (b.avg-a.avg);
      if(a.category==='UNDER_SAFETY_TRANSPORT') return (a.weeksToUnderSafetyTransport-b.weeksToUnderSafetyTransport) || (b.avg-a.avg);
      if(a.category==='UNDER_SAFETY_DEMAND') return (a.weeksToUnderSafetyDemand-b.weeksToUnderSafetyDemand) || (b.avg-a.avg);
      if(a.category==='OVERSTOCK') return b.overstockValue - a.overstockValue;
      return b.current - a.current;
    }
    if(state.category==='RUPTURE') return (a.weeksToRupture-b.weeksToRupture) || (b.avg-a.avg);
    if(state.category==='UNDER_SAFETY_TRANSPORT') return (a.weeksToUnderSafetyTransport-b.weeksToUnderSafetyTransport) || (b.avg-a.avg);
    if(state.category==='UNDER_SAFETY_DEMAND') return (a.weeksToUnderSafetyDemand-b.weeksToUnderSafetyDemand) || (b.avg-a.avg);
    if(state.category==='OVERSTOCK') return b.overstockValue - a.overstockValue;
    if(state.category==='SWEET_SPOT'){
      const aFlag = a.farRupture || a.farUnderSafetyTransport || a.farUnderSafetyDemand;
      const bFlag = b.farRupture || b.farUnderSafetyTransport || b.farUnderSafetyDemand;
      if(aFlag !== bFlag) return aFlag ? -1 : 1;
      if(aFlag && bFlag){
        const aW = a.farRupture ? a.weeksToRupture : (a.farUnderSafetyTransport ? a.weeksToUnderSafetyTransport : a.weeksToUnderSafetyDemand);
        const bW = b.farRupture ? b.weeksToRupture : (b.farUnderSafetyTransport ? b.weeksToUnderSafetyTransport : b.weeksToUnderSafetyDemand);
        return aW - bW;
      }
      return b.current - a.current;
    }
    return b.current - a.current;
  });
  return arr;
}

function scopedItemsForCounts(){
  return state.scope==='mine' && state.currentOwner ? state.items.filter(i=>i.owner===state.currentOwner) : state.items;
}

function getSupplierList(){
  const set = new Set();
  scopedItemsForCounts().forEach(i=>{ if(i.supplier && i.supplier!=='-') set.add(i.supplier); });
  return [...set].sort((a,b)=>a.localeCompare(b));
}

function getFamilyList(){
  const set = new Set();
  scopedItemsForCounts().forEach(i=>i.families.forEach(f=>set.add(f)));
  const arr = [...set].sort((a,b)=>{
    if(a==='Non catégorisé') return 1;
    if(b==='Non catégorisé') return -1;
    return a.localeCompare(b);
  });
  return arr;
}

function sparkPath(projection, w, hgt){
  if(!projection.length) return '';
  const vals = projection.map(p=>p.value);
  const max = Math.max(...vals, 1);
  const min = Math.min(...vals, 0);
  const range = (max-min) || 1;
  const step = w/(vals.length-1||1);
  const y = v => hgt - ((v-min)/range)*hgt;
  let d = vals.map((v,i)=> `${i===0?'M':'L'}${(i*step).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return { d, zeroY: y(0) };
}

function renderSparkline(it){
  const w=100,hgt=28;
  const sp = sparkPath(it.projection, w, hgt);
  if(!sp) return '';
  const color = COLORS[it.category].hex;
  return h`<svg width="${w}" height="${hgt+4}" viewBox="0 0 ${w} ${hgt+4}">
    <line x1="0" y1="${sp.zeroY.toFixed(1)}" x2="${w}" y2="${sp.zeroY.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="${sp.d}" fill="none" stroke="${color}" stroke-width="1.6"/>
  </svg>`;
}

/* ---------------------------- RENDER: TEAM OVERVIEW ---------------------------- */
function buildOwnerStats(){
  const byOwner = {};
  const ensure = o => { if(!byOwner[o]) byOwner[o] = { owner:o, RUPTURE:0, UNDER_SAFETY_TRANSPORT:0, UNDER_SAFETY_DEMAND:0, OVERSTOCK:0, SWEET_SPOT:0, INACTIVE:0, overstockValue:0, totalValue:0, soonestRupture:null, soonestRupturePn:null, noForecast:0 }; return byOwner[o]; };
  state.items.forEach(it=>{
    const s = ensure(it.owner);
    s[it.category] = (s[it.category]||0)+1;
    s.totalValue += (it.overstockValue||0); // value of stock sitting in the calendar, ALL items, not just flagged surstock
    if(it.category==='OVERSTOCK') s.overstockValue += (it.overstockValue||0);
    if(it.category==='RUPTURE' && (s.soonestRupture===null || it.weeksToRupture<s.soonestRupture)){
      s.soonestRupture = it.weeksToRupture; s.soonestRupturePn = it.pn;
    }
  });
  state.noForecast.forEach(it=>{ ensure(it.owner).noForecast++; });
  return Object.values(byOwner);
}

function buildOwnerBarplotSVG(stats){
  const cats = [
    {k:'RUPTURE', c:COLORS.RUPTURE.hex}, {k:'UNDER_SAFETY_TRANSPORT', c:COLORS.UNDER_SAFETY_TRANSPORT.hex},
    {k:'UNDER_SAFETY_DEMAND', c:COLORS.UNDER_SAFETY_DEMAND.hex},
    {k:'OVERSTOCK', c:COLORS.OVERSTOCK.hex}, {k:'SWEET_SPOT', c:COLORS.SWEET_SPOT.hex},
  ];
  const w = 760, h = 260, padL = 46, padR = 12, padT = 14, padB = 42;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const maxV = Math.max(...stats.flatMap(s=>cats.map(c=>s[c.k]||0)), 1);
  const groupW = innerW/stats.length;
  const barGap = 3, groupPad = 14;
  const barW = (groupW - groupPad*2 - barGap*(cats.length-1)) / cats.length;
  const y = v => padT + innerH - (v/maxV)*innerH;

  let grid = '';
  const gridCount = 4;
  for(let g=0; g<=gridCount; g++){
    const v = (maxV*g/gridCount);
    const gy = y(v);
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="#232833" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#5c6572" font-family="IBM Plex Mono">${Math.round(v)}</text>`;
  }

  let bars = '', labels = '';
  stats.forEach((s,gi)=>{
    const gx0 = padL + gi*groupW + groupPad;
    cats.forEach((c,ci)=>{
      const v = s[c.k]||0;
      const bx = gx0 + ci*(barW+barGap);
      const by = y(v);
      const bh = (padT+innerH) - by;
      bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" fill="${c.c}" rx="1.5"><title>${esc(ownerLabel(s.owner))}, ${t('cat_'+c.k)} : ${v}</title></rect>`;
      if(v>0 && barW>10) bars += `<text x="${(bx+barW/2).toFixed(1)}" y="${(by-4).toFixed(1)}" text-anchor="middle" font-size="9" fill="#9aa4b2" font-family="IBM Plex Mono">${v}</text>`;
    });
    const gcx = padL + gi*groupW + groupW/2;
    labels += `<text x="${gcx.toFixed(1)}" y="${h-14}" text-anchor="middle" font-size="11" fill="#c9cedb" font-family="IBM Plex Sans Condensed" font-weight="600">${esc(ownerLabel(s.owner))}</text>`;
  });

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;">${grid}${bars}${labels}</svg>`;
}

function renderOverviewBar(s, total){
  const w = 100;
  const segs = [
    {v:s.RUPTURE, c:COLORS.RUPTURE.hex}, {v:s.UNDER_SAFETY_TRANSPORT, c:COLORS.UNDER_SAFETY_TRANSPORT.hex},
    {v:s.UNDER_SAFETY_DEMAND, c:COLORS.UNDER_SAFETY_DEMAND.hex},
    {v:s.OVERSTOCK, c:COLORS.OVERSTOCK.hex}, {v:s.SWEET_SPOT, c:COLORS.SWEET_SPOT.hex},
    {v:s.INACTIVE, c:'#3a4150'},
  ];
  let x = 0, rects = '';
  segs.forEach(seg=>{
    if(seg.v<=0) return;
    const sw = (seg.v/total)*w;
    rects += `<rect x="${x.toFixed(1)}" y="0" width="${sw.toFixed(1)}" height="10" fill="${seg.c}"/>`;
    x += sw;
  });
  return `<svg viewBox="0 0 ${w} 10" width="100%" height="10" style="display:block; border-radius:2px; overflow:hidden;">${rects}</svg>`;
}

/* ---------------------------- RENDER: DRAWER ---------------------------- */
function statusBannerContent(it){
  const meta = COLORS[it.category];
  let title, sub;
  if(it.category==='RUPTURE'){ title = it.weeksToRupture===0 ? t('b_already') : t('b_rupture_t', fmtWeeks(it.weeksToRupture)); sub = t('b_rupture_s', stockDate(it.weeksToRupture)); }
  else if(it.category==='UNDER_SAFETY_TRANSPORT'){ title = t('b_transport_t'); sub = t('b_transport_s', SETTINGS.safetyDelayWeeks, stockDate(it.weeksToUnderSafetyTransport)); }
  else if(it.category==='UNDER_SAFETY_DEMAND'){ title = t('b_demand_t'); sub = t('b_demand_s', fmtNum(it.demandSpikeThreshold), SETTINGS.demandSpikeMultiplier, SETTINGS.ruptureHorizonWeeks, stockDate(it.weeksToUnderSafetyDemand)); }
  else if(it.category==='OVERSTOCK'){ title = t('cat_OVERSTOCK'); sub = t('b_overstock_s', fmtEur(it.overstockValue), fmtEur(SETTINGS.overstockValueThreshold)); }
  else if(it.category==='SWEET_SPOT'){
    if(it.farRupture){ title = t('b_far_rupture_t', fmtWeeks(it.weeksToRupture)); sub = t('b_far_rupture_s', stockDate(it.weeksToRupture), SETTINGS.ruptureHorizonWeeks); }
    else if(it.farUnderSafetyTransport){ title = t('b_far_transport_t', fmtWeeks(it.weeksToUnderSafetyTransport)); sub = t('b_far_transport_s', SETTINGS.safetyDelayWeeks, stockDate(it.weeksToUnderSafetyTransport), SETTINGS.ruptureHorizonWeeks); }
    else if(it.farUnderSafetyDemand){ title = t('b_far_demand_t', fmtWeeks(it.weeksToUnderSafetyDemand)); sub = t('b_far_demand_s', SETTINGS.demandSpikeMultiplier, stockDate(it.weeksToUnderSafetyDemand), SETTINGS.ruptureHorizonWeeks); }
    else { title = t('b_sweet_t'); sub = t('b_sweet_s', SETTINGS.safetyDelayWeeks, SETTINGS.demandSpikeMultiplier, fmtEur(it.overstockValue)); }
  }
  else { title=t('cat_INACTIVE'); sub=t('b_inactive_s'); }
  return { meta, title, sub };
}

/* ---------------------------- SVG CHARTS (no external library: always works) ---------------------------- */
function buildStockChartSVG(it, sim){
  // `sim` (optional) = result of simulatePlan(): when present, the chart overlays the user's EDI plan -
  // the original curve fades to a thin gray reference, and the new baseline / new delayed take over.
  const w = 720, h = 220, padL = 44, padR = 12, padT = 12, padB = 26;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const orig = it.projection.map(p=>p.value);
  const origDelayed = buildEDIDelayCalendar(it, SETTINGS.safetyDelayWeeks);
  const data = sim ? sim.baseline : orig;
  const delayed = sim ? sim.delayed : origDelayed;
  const spikeThreshold = it.demandSpikeThreshold || 0;
  const allVals = data.concat(delayed).concat(sim ? orig : []).concat([0, spikeThreshold]);
  const max = Math.max(...allVals), min = Math.min(...allVals);
  const range = (max-min) || 1;
  const pad = range*0.08;
  const yMax = max+pad, yMin = min-pad, yRange = (yMax-yMin)||1;
  const n = data.length;
  const x = i => padL + (n<=1 ? 0 : (i/(n-1))*innerW);
  const y = v => padT + innerH - ((v-yMin)/yRange)*innerH;

  const pointColors = data.map((v,i)=>{
    if(v<0) return COLORS.RUPTURE.hex;
    if(delayed[i]<0) return COLORS.UNDER_SAFETY_TRANSPORT.hex;
    if(spikeThreshold>0 && v<spikeThreshold) return COLORS.UNDER_SAFETY_DEMAND.hex;
    return it.category==='OVERSTOCK' && !sim ? COLORS.OVERSTOCK.hex : COLORS.SWEET_SPOT.hex;
  });

  const gridCount = 4;
  let grid = '';
  for(let g=0; g<=gridCount; g++){
    const v = yMin + (yRange*g/gridCount);
    const gy = y(v);
    grid += `<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="#232833" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="#5c6572" font-family="IBM Plex Mono">${fmtAxis(v)}</text>`;
  }
  let zeroLine = '';
  if(yMin<0 && yMax>0){
    const zy = y(0);
    zeroLine = `<line x1="${padL}" y1="${zy.toFixed(1)}" x2="${w-padR}" y2="${zy.toFixed(1)}" stroke="${COLORS.RUPTURE.hex}" stroke-width="1.2" stroke-dasharray="3,3"/>`;
  }
  let spikeLine = '';
  if(spikeThreshold>0){
    const sy = y(spikeThreshold);
    spikeLine = `<line x1="${padL}" y1="${sy.toFixed(1)}" x2="${w-padR}" y2="${sy.toFixed(1)}" stroke="${COLORS.UNDER_SAFETY_DEMAND.hex}" stroke-width="1.2" stroke-dasharray="3,3"><title>${t('ch_spike_title', fmtNum(spikeThreshold))}</title></line>`;
    spikeLine += `<text x="${w-padR}" y="${(sy-4).toFixed(1)}" text-anchor="end" font-size="9" fill="${COLORS.UNDER_SAFETY_DEMAND.hex}" font-family="IBM Plex Mono">${t('ch_spike_label')}</text>`;
  }
  let xLabels = '';
  const step = Math.ceil(n/8);
  for(let i=0;i<n;i+=step){
    xLabels += `<text x="${x(i).toFixed(1)}" y="${h-8}" text-anchor="${i===n-1?'end':'middle'}" font-size="9.5" fill="#5c6572" font-family="IBM Plex Mono">${stockDate(i)}</text>`;
  }
  const pathOf = arr => arr.map((v,i)=> `${i===0?'M':'L'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const mainPath = pathOf(data);
  const points = data.map((v,i)=> `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${pointColors[i]}"><title>${stockDate(i)} : ${fmtNum(v)}</title></circle>`).join('');
  const delayPath = pathOf(delayed);
  const origPath = sim ? `<path d="${pathOf(orig)}" fill="none" stroke="#5c6572" stroke-width="1.2"><title>${t('ch_orig')}</title></path>` : '';

  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;">
    ${grid}${zeroLine}${spikeLine}
    ${origPath}
    <path d="${delayPath}" fill="none" stroke="${COLORS.UNDER_SAFETY_TRANSPORT.hex}" stroke-width="1.4" stroke-dasharray="3,3"/>
    <path d="${mainPath}" fill="none" stroke="#c9cedb" stroke-width="2"/>
    ${points}
    ${xLabels}
  </svg>`;
}

function buildNeedChartSVG(it){
  const w = 720, h = 150, padL = 44, padR = 12, padT = 10, padB = 26;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const vals = it.weeklyNeed.map(wk=>wk.value);
  const max = Math.max(...vals, 1);
  const n = vals.length;
  const barW = Math.max(1.5, (innerW/n) * 0.62);
  const gap = innerW/n;
  const y = v => padT + innerH - (v/max)*innerH;
  let bars = '';
  vals.forEach((v,i)=>{
    const bx = padL + i*gap + (gap-barW)/2;
    const by = y(v);
    const bh = (padT+innerH) - by;
    bars += `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" fill="#4c9fe855" stroke="#4c9fe8" stroke-width="1" rx="1"><title>${esc(it.weeklyNeed[i].date||it.weeklyNeed[i].label)} : ${fmtNum(v)}</title></rect>`;
  });
  let grid = `<line x1="${padL}" y1="${(padT+innerH).toFixed(1)}" x2="${w-padR}" y2="${(padT+innerH).toFixed(1)}" stroke="#232833" stroke-width="1"/>`;
  grid += `<text x="${padL-8}" y="${padT+4}" text-anchor="end" font-size="9.5" fill="#5c6572" font-family="IBM Plex Mono">${fmtAxis(max)}</text>`;
  let xLabels = '';
  const step = Math.ceil(n/8);
  for(let i=0;i<n;i+=step){
    const lx = padL + i*gap + gap/2;
    xLabels += `<text x="${lx.toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="9" fill="#5c6572" font-family="IBM Plex Mono">${esc((it.weeklyNeed[i].date||it.weeklyNeed[i].label||'').toString())}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;">${grid}${bars}${xLabels}</svg>`;
}
