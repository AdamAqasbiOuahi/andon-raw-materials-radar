/* ---------------------------- EDI PLANNER UI ---------------------------- */
function existingEdiByDate(it){
  const m = {};
  (it.openOrders||[]).forEach(po=>po.weeks.forEach(w=>{ if(w.qty>0) m[w.date]=(m[w.date]||0)+w.qty; }));
  return m;
}
function ediStatusLabel(s){
  return s==='ok' ? 'OK' : s==='rupture' ? t('m_rupture') : s==='transport' ? t('m_transport') : t('m_demand');
}
function verdictHTML(it, sim){
  const unit = niceUnitFor(it);
  if(sim.ok){
    return `<div class="edi-verdict ok">${ICONS.check}<div>${t('v_ok', SETTINGS.safetyDelayWeeks, SETTINGS.demandSpikeMultiplier, fmtNum(sim.totalQty))}</div></div>`;
  }
  if(sim.failCount===sim.unfixable){
    const msg = sim.unfixable===1 ? t('v_warn_one', fmtNum(sim.totalQty)) : t('v_warn_many', sim.unfixable, fmtNum(sim.totalQty));
    return `<div class="edi-verdict warn">${ICONS.warn}<div>${msg}</div></div>`;
  }
  const fixable = sim.failCount - sim.unfixable;
  const unfixPart = sim.unfixable ? (sim.unfixable===1 ? t('v_unfix_one') : t('v_unfix_many', sim.unfixable)) : '';
  const msg = fixable===1
    ? t('v_bad_one', stockDate(sim.firstFail), ediStatusLabel(sim.weekStatus[sim.firstFail]), unfixPart, fmtNum(unit))
    : t('v_bad_many', fixable, stockDate(sim.firstFail), ediStatusLabel(sim.weekStatus[sim.firstFail]), unfixPart, fmtNum(unit));
  return `<div class="edi-verdict bad">${ICONS.stop}<div>${msg}</div></div>`;
}
function renderEdiPlanner(it){
  const open = state.ediPlannerOpen && state.ediPlan && state.ediPlan.pn===it.pn;
  if(!open){
    return `<div class="dr-section">
      <button class="btn edi-open-btn" id="btnOpenEdiPlanner">${ICONS.spike} ${t('edi_open')}</button>
      <div class="edi-open-hint">${t('edi_open_hint')}</div>
    </div>`;
  }
  const weeks = getEdiWeeks(it);
  const qty = state.ediPlan.qty;
  const sim = simulatePlan(it, qty);
  const extra = computeMinPlan(it, 0, qty);
  const existing = existingEdiByDate(it);
  const unit = niceUnitFor(it);
  const cells = weeks.map(w=>{
    const q = qty[w.j] || 0;
    const ex = extra[w.j] || 0;
    const st = sim.weekStatus[w.landIdx];
    const already = existing[w.date] || 0;
    return `<div class="edi-cell st-${st}" data-edi-cell="${w.j}" title="${t('edi_cell_tt', esc(w.date), plantArrivalDate(w.landIdx))}">
      <div class="edi-date">${esc(w.date)}</div>
      <div class="edi-existing">${already>0?t('edi_already', fmtNum(already)):'&nbsp;'}</div>
      <input type="number" class="edi-input" data-edi-input="${w.j}" min="0" step="${unit}" value="${q>0?q:''}" placeholder="0">
      <div class="edi-hint ${ex>0?'need':''}" data-edi-hint="${w.j}">${ex>0?'+ '+fmtNum(Math.ceil(ex)):'✓'}</div>
      <div class="edi-dot" data-edi-dot="${w.j}" title="${ediStatusLabel(st)}"></div>
    </div>`;
  }).join('');
  return `<div class="dr-section edi-planner" id="ediPlanner">
    <div class="edi-head">
      <h4 style="margin:0;">${t('edi_title')}</h4>
      <div class="edi-actions">
        <button class="btn primary" id="btnEdiGenerate" title="${t('edi_gen_tt', fmtNum(unit))}">${ICONS.spike} ${t('edi_gen')}</button>
        <button class="btn ghost" id="btnEdiClear">${t('edi_clear')}</button>
        <button class="btn ghost" id="btnEdiExport" title="${t('edi_csv_tt')}">${ICONS.download} CSV</button>
        <button class="btn ghost" id="btnEdiClose" title="${t('edi_close_tt')}">${ICONS.x}</button>
      </div>
    </div>
    <div class="edi-explain">${t('edi_explain', RABEN_TO_PLANT_WEEKS, SETTINGS.safetyDelayWeeks)}</div>
    <div id="ediVerdict">${verdictHTML(it, sim)}</div>
    <div class="edi-strip-wrap"><div class="edi-strip">${cells}</div></div>
    <div class="edi-legend">
      <span><i class="edi-dot st-ok"></i> OK</span>
      <span><i class="edi-dot st-demand"></i> ${t('lg_edi_demand')}</span>
      <span><i class="edi-dot st-transport"></i> ${t('lg_edi_transport')}</span>
      <span><i class="edi-dot st-rupture"></i> ${t('lg_edi_rupture')}</span>
    </div>
  </div>`;
}
function refreshEdiPlanner(it){
  // live update without rebuilding the inputs (keeps focus): chart, verdict, per-week hints & dots
  const qty = state.ediPlan.qty;
  const sim = simulatePlan(it, qty);
  const extra = computeMinPlan(it, 0, qty);
  const chart = document.getElementById('drawerChart');
  if(chart) chart.innerHTML = buildStockChartSVG(it, sim);
  const v = document.getElementById('ediVerdict');
  if(v) v.innerHTML = verdictHTML(it, sim);
  getEdiWeeks(it).forEach(w=>{
    const cell = document.querySelector(`[data-edi-cell="${w.j}"]`);
    if(!cell) return;
    const st = sim.weekStatus[w.landIdx];
    cell.className = `edi-cell st-${st}`;
    const hint = cell.querySelector('[data-edi-hint]');
    const ex = extra[w.j] || 0;
    if(hint){ hint.textContent = ex>0 ? '+ '+fmtNum(Math.ceil(ex)) : '✓'; hint.className = 'edi-hint '+(ex>0?'need':''); }
    const dot = cell.querySelector('[data-edi-dot]');
    if(dot) dot.title = ediStatusLabel(st);
  });
}
function bindEdiPlanner(){
  const it = state.drawerItem;
  if(!it) return;
  const openBtn = document.getElementById('btnOpenEdiPlanner');
  if(openBtn) openBtn.addEventListener('click', ()=>{
    setState({ ediPlannerOpen:true, ediPlan:{ pn: it.pn, qty: new Array(it.weeklyNeed.length).fill(0) } });
    const el = document.getElementById('ediPlanner'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  });
  const closeBtn = document.getElementById('btnEdiClose');
  if(closeBtn) closeBtn.addEventListener('click', ()=> setState({ ediPlannerOpen:false, ediPlan:null }));
  const clearBtn = document.getElementById('btnEdiClear');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    state.ediPlan.qty = new Array(it.weeklyNeed.length).fill(0);
    document.querySelectorAll('[data-edi-input]').forEach(inp=>{ inp.value=''; });
    refreshEdiPlanner(it);
  });
  const genBtn = document.getElementById('btnEdiGenerate');
  if(genBtn) genBtn.addEventListener('click', ()=>{
    const plan = computeMinPlan(it, niceUnitFor(it));
    state.ediPlan.qty = plan;
    document.querySelectorAll('[data-edi-input]').forEach(inp=>{ const j=parseInt(inp.dataset.ediInput,10); inp.value = plan[j]>0 ? plan[j] : ''; });
    refreshEdiPlanner(it);
  });
  const expBtn = document.getElementById('btnEdiExport');
  if(expBtn) expBtn.addEventListener('click', ()=>{
    const weeks = getEdiWeeks(it);
    const rows = [['PN',t('eexp_week'),t('eexp_label'),t('eexp_qty'),t('eexp_arr')]];
    weeks.forEach(w=>{ const q = state.ediPlan.qty[w.j]||0; if(q>0) rows.push([it.pn, w.date, w.label, Math.round(q), plantArrivalDate(w.landIdx)]); });
    if(rows.length===1) rows.push([it.pn,'','',t('eexp_none'),'']);
    downloadCSV(`edi_plan_${it.pn}_${new Date().toISOString().slice(0,10)}.csv`, rows);
  });
  document.querySelectorAll('[data-edi-input]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const j = parseInt(inp.dataset.ediInput,10);
      const v = parseFloat(e.target.value);
      state.ediPlan.qty[j] = isNaN(v)||v<0 ? 0 : v;
      refreshEdiPlanner(it);
    });
    inp.addEventListener('keydown', e=>{ e.stopPropagation(); });
  });
}

      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(pn).then(showCopied).catch(()=>{
          const ta = document.createElement('textarea');
          ta.value = pn; document.body.appendChild(ta); ta.select();
          try{ document.execCommand('copy'); showCopied(); } finally { document.body.removeChild(ta); }
        });
      } else {
        const ta = document.createElement('textarea');
        ta.value = pn; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); showCopied(); } finally { document.body.removeChild(ta); }
      }
    });
  });
}

function renderListOnly(){
  const wrap = document.querySelector('.list-wrap');
  if(wrap) wrap.outerHTML = renderList();
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const it = state.items.find(i=>i.pn===el.dataset.open);
      setState({ drawerItem: it, ediPlannerOpen:false, ediPlan:null });
    });
  });
  bindCopyButtons();
}

function exportCurrentView(){
  const items = getFilteredItems();
  const header = ['PN',t('i_owner'),t('exp_projects'),t('col_supplier'),t('k_stock'),t('k_need'),t('i_cat'),t('exp_w_rupture'),t('exp_w_t'),t('exp_w_d'),t('exp_cover'),t('exp_value')];
  const rows = [header].concat(items.map(it=>[
    it.pn, ownerLabel(it.owner), it.families.map(famLabel).join(' / '), it.supplier, Math.round(it.current), Math.round(it.avg),
    t('cat_'+it.category), it.weeksToRupture ?? '', it.weeksToUnderSafetyTransport ?? '', it.weeksToUnderSafetyDemand ?? '',
    it.coverageNow===Infinity?'∞':Math.round(it.coverageNow*10)/10, Math.round(it.overstockValue||0),
  ]));
  downloadCSV(`andon_${state.category.toLowerCase()}_${new Date().toISOString().slice(0,10)}.csv`, rows);
}

/* ---------------------------- BOOT ----------------------------
   URL options: ?lang=fr|en|it sets the interface language, ?demo loads the synthetic sample at once
   (e.g. https://<user>.github.io/<repo>/?demo&lang=en). */
(function boot(){
  const q = new URLSearchParams(location.search);
  const lang = (q.get('lang')||'').toLowerCase();
  if(I18N[lang]){ LANG = lang; document.documentElement.lang = LANG; }
  render();
  if(q.has('demo')) loadDemo();
})();
</script>
